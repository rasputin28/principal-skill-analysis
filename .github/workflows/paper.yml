name: paper

on:
  push:
    branches: [main]
    paths: ['paper/**', 'paper.md', 'scripts/build-paper-md.sh', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Fail on unresolved references
        working-directory: paper
        run: |
          if grep -qE 'LaTeX Warning: (Reference|Citation).*undefined' main.log; then
            grep -E 'LaTeX Warning: (Reference|Citation).*undefined' main.log
            exit 1
          fi
          echo "no undefined references or citations"
      - name: Check that paper.md is in sync with the LaTeX
        env:
          # Pinned: pandoc's markdown output differs between versions, so an
          # unpinned installation turns this check into noise about the runner
          # rather than about the document. Keep in step with PANDOC_VERSION in
          # scripts/build-paper-md.sh.
          PANDOC_VERSION: "3.10"
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
          ./scripts/build-paper-md.sh
          if ! git diff --quiet -- paper.md; then
            echo "paper.md is stale. Run scripts/build-paper-md.sh and commit the result."
            git diff --stat -- paper.md
            exit 1
          fi
          echo "paper.md is in sync"

      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/main.pdf
