<text x="78" y="448" font-size="12" fill="#0b0b0b">At N = 60 the first two differ by a factor of 6 x 10<tspan font-size="8.5" dy="-5">14</tspan><tspan dy="5">.</tspan></text>
<text x="78" y="468" font-size="11.5" fill="#52514e">The third route needs the coefficients to be sparse as well as low order, and buys a further reduction only when they are.</text>
